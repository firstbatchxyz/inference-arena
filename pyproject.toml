[project]
name = "inference-arena"
version = "0.1.0"
description = "Benchmarking tool for LLM inference using vLLM, SGLang, and Ollama on Runpod"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "runpod>=1.6.0",
    "requests>=2.31.0",
    "pymongo>=4.6.0",
    "httpx>=0.25.0",
    "datasets>=2.14.0",
    "guidellm>=0.1.0",
    "pyyaml>=6.0",
    "urllib3>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
benchmark-vllm = "run_vllm_benchmark_with_runpod:main"
benchmark-sglang = "run_sglang_benchmark_with_runpod:main"
benchmark-ollama = "run_ollama_benchmark_with_runpod:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "ipython>=8.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clients", "utils"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
